# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/spotihuy
spring.datasource.username=spotihuy_user
spring.datasource.password=spotihuy_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=spotihuy-secret-key-change-in-production
jwt.expiration=86400000

# Media Proxy Configuration
media.proxy.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
media.proxy.timeout=30000

# Logging
logging.level.com.spotihuy.backend=DEBUG
logging.level.org.springframework.security=DEBUG