version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: spotihuy-postgres
    environment:
      POSTGRES_DB: spotihuy
      POSTGRES_USER: spotihuy_user
      POSTGRES_PASSWORD: spotihuy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: